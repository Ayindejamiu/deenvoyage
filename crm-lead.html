<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lead — Deen Voyage CRM</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/crm.css">
</head>
<body>

<nav class="crm-navbar">
  <div class="brand">🕌 Deen Voyage <span>CRM</span></div>
  <div class="user-menu" id="user-menu-btn">
    <div class="user-avatar" id="user-initials">…</div>
    <span id="user-name"></span>
  </div>
</nav>
<div class="user-dropdown" id="user-dropdown">
  <button class="logout" id="logout-btn">Sign out</button>
</div>
<div id="dropdown-bd" style="display:none;position:fixed;inset:0;z-index:2999;"></div>

<div class="lead-detail">
  <a href="crm.html" class="back-btn">← Back to Dashboard</a>
  <div id="lead-content"><p style="color:#6b7280;">Loading…</p></div>
</div>

<!-- ══ EDIT LEAD MODAL ══════════════════════════════════════ -->
<div class="modal-overlay" id="modal-edit-lead">
  <div class="modal-box modal-lg">
    <div class="modal-header">
      <h3>Edit Lead</h3>
      <button class="modal-close" data-close="modal-edit-lead">✕</button>
    </div>
    <div class="modal-body">
      <form class="crm-form" id="edit-lead-form">
        <div class="form-section-title">Personal Information</div>
        <div class="form-row">
          <div class="form-group"><label>First Name *</label><input type="text" name="firstName" required></div>
          <div class="form-group"><label>Last Name *</label><input type="text" name="lastName" required></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Email</label><input type="email" name="email"></div>
          <div class="form-group"><label>Phone</label><input type="tel" name="phone"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>WhatsApp</label><input type="tel" name="whatsapp"></div>
          <div class="form-group"><label>Country</label>
            <select name="country">
              <option value="CA">Canada</option><option value="NG">Nigeria</option>
              <option value="UK">United Kingdom</option><option value="US">United States</option>
              <option value="OTHER">Other</option>
            </select>
          </div>
        </div>
        <div class="form-section-title">Travel Details</div>
        <div class="form-row">
          <div class="form-group"><label>Travel Type</label>
            <select name="travelType">
              <option value="">Select…</option>
              <option value="hajj">🕌 Hajj</option><option value="umrah">🕋 Umrah</option>
              <option value="ramadan">🌙 Ramadan Umrah</option><option value="december">📅 December Umrah</option>
              <option value="vacation">✈️ Islamic Vacation</option>
            </select>
          </div>
          <div class="form-group"><label>Travel Month</label><input type="month" name="travelMonth"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Room Type</label>
            <select name="roomType">
              <option value="">Not specified</option>
              <option value="quad">Quad (4 persons)</option><option value="triple">Triple (3 persons)</option>
              <option value="double">Double (2 persons)</option><option value="single">Single (1 person)</option>
            </select>
          </div>
          <div class="form-group"><label>No. of Travelers</label><input type="number" name="travelersCount" min="1"></div>
        </div>
        <div class="form-group"><label>Package Preference</label><input type="text" name="packagePreference"></div>
        <div class="form-section-title">Passport</div>
        <div class="form-row">
          <div class="form-group"><label>Passport Type</label>
            <select name="passportType">
              <option value="">Not provided</option><option value="canadian">Canadian</option>
              <option value="nigerian">Nigerian</option><option value="british">British</option><option value="other">Other</option>
            </select>
          </div>
          <div class="form-group"><label>Passport Number</label><input type="text" name="passportNumber"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Passport Expiry</label><input type="date" name="passportExpiry"></div>
          <div class="form-group"><label>Country of Issue</label><input type="text" name="passportCountry"></div>
        </div>
        <div class="form-section-title">Status &amp; Assignment</div>
        <div class="form-row">
          <div class="form-group"><label>Status</label>
            <select name="status">
              <option value="new">New Lead</option><option value="in_discussion">In Discussion</option>
              <option value="deposit_paid">Deposit Paid</option><option value="paid_full">Paid Full</option>
              <option value="will_pay">Will Pay</option><option value="follow_up">Needs Follow-up</option>
              <option value="competitor">Gone to Competitor</option><option value="diy">DIY</option>
              <option value="cancelled">Cancelled</option><option value="completed">Completed</option>
              <option value="refund">Refund</option>
            </select>
          </div>
          <div class="form-group"><label>Follow-up Date</label><input type="date" name="followUpDate"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Source</label>
            <select name="source">
              <option value="website">Website Form</option><option value="whatsapp">WhatsApp</option>
              <option value="phone">Phone Call</option><option value="referral">Referral</option>
              <option value="social">Social Media</option><option value="walk_in">Walk-in</option>
            </select>
          </div>
          <div class="form-group"><label>Assigned Agent</label>
            <select name="assignedTo" id="edit-agent-select"><option value="">Unassigned</option></select>
          </div>
        </div>
        <div class="form-section-title">Financials</div>
        <div class="form-row">
          <div class="form-group"><label>Currency</label>
            <select name="currency">
              <option value="CAD">CAD ($)</option><option value="NGN">NGN (₦)</option><option value="GBP">GBP (£)</option>
            </select>
          </div>
          <div class="form-group"><label>Quoted Price</label><input type="number" name="quotedPrice" min="0"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Total Paid</label><input type="number" name="totalPaid" min="0"></div>
          <div class="form-group"><label>Payment Due Date</label><input type="date" name="paymentDueDate"></div>
        </div>
        <div class="form-section-title">Notes</div>
        <div class="form-group"><textarea name="notes" rows="4"></textarea></div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-danger-crm" id="delete-lead-btn">Delete Lead</button>
      <button class="btn-secondary-crm" data-close="modal-edit-lead">Cancel</button>
      <button class="btn-primary-crm" id="save-edit-btn">Save Changes</button>
    </div>
  </div>
</div>

<!-- ══ LOG INTERACTION MODAL ════════════════════════════════ -->
<div class="modal-overlay" id="modal-interaction">
  <div class="modal-box">
    <div class="modal-header">
      <h3>Log Interaction</h3>
      <button class="modal-close" data-close="modal-interaction">✕</button>
    </div>
    <div class="modal-body">
      <form class="crm-form" id="interaction-form">
        <div class="form-row">
          <div class="form-group"><label>Type</label>
            <select name="type">
              <option value="call">📞 Phone Call</option>
              <option value="whatsapp">💬 WhatsApp</option>
              <option value="email">✉️ Email</option>
              <option value="in_person">🤝 In Person</option>
              <option value="note">📝 Note</option>
            </select>
          </div>
          <div class="form-group"><label>Date &amp; Time</label><input type="datetime-local" name="date"></div>
        </div>
        <div class="form-group"><label>Notes / Summary *</label><textarea name="notes" rows="4" required placeholder="What was discussed?"></textarea></div>
        <div class="form-row">
          <div class="form-group"><label>Next Action</label><input type="text" name="nextAction" placeholder="e.g. Send invoice, Follow up…"></div>
          <div class="form-group"><label>Next Action Date</label><input type="date" name="nextActionDate"></div>
        </div>
        <div class="form-group"><label>Also update lead status?</label>
          <select name="newStatus">
            <option value="">No change</option>
            <option value="new">New Lead</option><option value="in_discussion">In Discussion</option>
            <option value="deposit_paid">Deposit Paid</option><option value="paid_full">Paid Full</option>
            <option value="will_pay">Will Pay</option><option value="follow_up">Needs Follow-up</option>
            <option value="competitor">Gone to Competitor</option><option value="diy">DIY</option>
            <option value="cancelled">Cancelled</option><option value="completed">Completed</option>
            <option value="refund">Refund</option>
          </select>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary-crm" data-close="modal-interaction">Cancel</button>
      <button class="btn-primary-crm" id="save-interaction-btn">Log It</button>
    </div>
  </div>
</div>

<!-- ══ CREATE RECEIPT MODAL ═════════════════════════════════ -->
<div class="modal-overlay" id="modal-receipt">
  <div class="modal-box">
    <div class="modal-header">
      <h3>🧾 Create Receipt</h3>
      <button class="modal-close" data-close="modal-receipt">✕</button>
    </div>
    <div class="modal-body">
      <form class="crm-form" id="receipt-form" onsubmit="return false">
        <div class="form-row">
          <div class="form-group"><label>Client Name *</label><input type="text" id="rc-name" required></div>
          <div class="form-group"><label>Email</label><input type="email" id="rc-email"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Package / Service *</label>
            <select id="rc-package" onchange="document.getElementById('rc-custom-wrap').style.display=this.value==='Other'?'':'none'">
              <option value="">— Select package —</option>
              <option value="August Umrah 2026">August Umrah 2026</option>
              <option value="November Umrah 2026">November Umrah 2026</option>
              <option value="December Umrah 2026">December Umrah 2026</option>
              <option value="Hajj 2027">Hajj 2027</option>
              <option value="Other">Other (specify below)</option>
            </select>
            <div id="rc-custom-wrap" style="display:none;margin-top:6px;">
              <input type="text" id="rc-custom" placeholder="e.g. Private Umrah Group">
            </div>
          </div>
          <div class="form-group"><label>Currency</label>
            <select id="rc-currency">
              <option value="CAD">CAD ($)</option>
              <option value="NGN">NGN (₦)</option>
              <option value="GBP">GBP (£)</option>
              <option value="USD">USD ($)</option>
            </select>
          </div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Total Amount *</label><input type="number" id="rc-total" min="0" step="0.01" required></div>
          <div class="form-group"><label>Initial Payment</label><input type="number" id="rc-paid" min="0" step="0.01" value="0"></div>
        </div>
        <div class="form-row">
          <div class="form-group"><label>Payment Date</label><input type="date" id="rc-date"></div>
          <div class="form-group"><label>Payment Note</label><input type="text" id="rc-note" placeholder="e.g. Deposit"></div>
        </div>
      </form>
      <div id="rc-status" class="rcp-status"></div>
    </div>
    <div class="modal-footer">
      <button class="btn-secondary-crm" data-close="modal-receipt">Cancel</button>
      <button class="btn-primary-crm" id="save-receipt-btn">Create Receipt</button>
    </div>
  </div>
</div>

<script type="module" src="js/crm-lead.js"></script>
</body>
</html>
